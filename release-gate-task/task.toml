artifacts = ["/app/release_gate.json"]

[task]
name = "dynamo/release-gate"
description = "Audit a staged Python release bundle against manifest, policy, and embedded distribution metadata."

[metadata]
category = "build_dependency_and_release_management"
subcategory = "release_artifacts"
task_objective = ["validate", "analyze"]
artifact_type = ["archive_or_compressed_artifact", "configuration_file", "generated_output_artifact"]
expert_time_estimate_hours = 3.5
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "A release engineer gates a synthetic fixture bundle before PyPI publish. Checksums pass on all six wheels. Beyond prior traps (dist-info path selection, exempt .asc, SHA256SUMS decoy, cp312 reference wheel), agents must also scan non-selected dist-info trees and non-primary PKG-INFO members — ignoring decoys after reading the primary metadata misses STALE_DIST_INFO_VERSION_MISMATCH and STALE_PKGINFO_VERSION_MISMATCH issues. Twenty-seven exact issues across eighteen rules; PEP 440 compares and primary-vs-stale enumeration are the main failure modes."
solution_explanation = "Load manifest and policy, enumerate artifact files, apply unmanifested exemptions, hash manifest entries, and for each wheel read the selected dist-info METADATA/WHEEL plus every other dist-info for stale version mismatches. Unfold headers, normalize Requires-Dist against the first manifest wheel, apply tag/name/sidecar rules. For each sdist, read primary PKG-INFO for rule 10 and scan other PKG-INFO members for rule 18. Sort issues by (code, path, detail)."
verification_explanation = "Exact-match on gate_passed false, blocking_issue_count 27, manifested_artifact_count 6, disk_artifact_count 10, full sorted issue list, asc exemption, and stale dist-info/pkg-info presence tests."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
