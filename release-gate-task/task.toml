artifacts = ["/app/release_gate.json"]

[task]
name = "dynamo/release-gate"
description = "Audit a staged Python release bundle against manifest, policy, and embedded distribution metadata."

[metadata]
category = "build_dependency_and_release_management"
subcategory = "release_artifacts"
task_objective = ["validate", "analyze"]
artifact_type = ["archive_or_compressed_artifact", "configuration_file", "generated_output_artifact"]
expert_time_estimate_hours = 2.5
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "A release or build engineer uses this gate before publishing a Python library to an index such as PyPI — verifying that wheels, sdist, manifest, and policy agree before a cut ships. The bundle is synthetic but realistic: hand-crafted wheels and an sdist with deliberate metadata, tag, and dependency inconsistencies. All three manifested wheels match their SHA-256 digests, so checksum-only validation reports success. Correct gating requires PEP 440 comparison in wheel METADATA and sdist PKG-INFO, cpNNN tag parsing against minimum_python_version 3.11, normalized Requires-Dist matching across wheels, and forbidden-tag policy. The universal wheel carries 2.0.9.post1 against manifest 2.0.9, the cp310 wheel violates the Python floor, the manylinux2014 wheel violates tag policy and adds urllib3, and the sdist is on disk but omitted from the manifest with PKG-INFO 2.0.8."
solution_explanation = "Load manifest.json and policy.json, enumerate artifacts/, and for each manifest entry verify sha256 and size_bytes. For wheels, read METADATA Version and Requires-Dist from the zip, compare versions with packaging.version.Version, parse wheel tags for forbidden substrings and cpNNN minimum Python, and compare normalized Requires-Dist sets to the first manifest wheel. Detect unmanifested files, enforce sdist-in-manifest policy (emit both SDIST_MISSING_FROM_MANIFEST and UNMANIFESTED_ARTIFACT when applicable), and PEP 440-compare every sdist PKG-INFO Version to release_version. Sort issues by (code, path, detail) using the exact detail templates from instruction.md."
verification_explanation = "The verifier asserts gate_passed is false, blocking_issue_count is 7, manifested_artifact_count is 3, disk_artifact_count is 4, and blocking_issues exactly matches the sorted list of seven issues with prescribed detail strings — including both sdist issues and PEP 440 / Requires-Dist / Python-tag failures that survive checksum validation."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
