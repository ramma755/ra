[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-tool"
version = "0.1.0"
description = "A local prototype for AI-assisted code review workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-review = "ai_code_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
