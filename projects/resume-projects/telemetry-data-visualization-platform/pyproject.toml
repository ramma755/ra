[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-data-visualization-platform"
version = "0.1.0"
description = "A Flask and WebSocket telemetry dashboard with D3 visualizations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask",
  "flask-sock",
]

[project.scripts]
telemetry-dashboard = "telemetry_dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]
