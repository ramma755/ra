[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-tool"
version = "0.1.0"
description = "A small Python CLI starter with text utility commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
project-tool = "project_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
