artifacts = ["/app/release_gate.json"]

[task]
name = "dynamo/release-gate"
description = "Audit a staged Python release bundle against manifest, policy, and embedded distribution metadata."

[metadata]
category = "build_dependency_and_release_management"
subcategory = "release_artifacts"
task_objective = ["validate", "analyze"]
artifact_type = ["archive_or_compressed_artifact", "configuration_file", "generated_output_artifact"]
expert_time_estimate_hours = 3.0
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "A release or build engineer uses this gate before publishing a Python library to an index such as PyPI. The bundle is synthetic but realistic: four manifested wheels, an sdist, checksum sidecars, and decoy files. All manifested wheels match SHA-256 digests, so checksum-only validation passes. Correct gating requires RFC 822 unfolding of METADATA Requires-Dist lines, PEP 440 comparisons against manifest entry versions and release_version, PEP 427 filename-version parsing, embedded WHEEL Tag vs filename tag comparison, PEP 503 name normalization, signature sidecar policy, cpNNN minimum Python, normalized Requires-Dist matching against the first manifest wheel (whose certifi dependency is on a folded continuation line), and forbidden-tag policy. Traps include a universal wheel whose manifest entry is 2.0.9.post1 while filename and release_version stay 2.0.9, a cp310 wheel whose internal WHEEL Tag disagrees with its filename, a cp311 wheel with manifest version 2.0.9.dev0 and folded urllib3, three wheels missing .asc sidecars while one orphan .asc is unmanifested, and an sdist on disk but omitted from the manifest."
solution_explanation = "Load manifest.json and policy.json, enumerate only regular files directly under artifacts/, and for each manifest entry verify sha256 and size_bytes. For wheels, unfold METADATA headers, read Name/Version/Requires-Dist, compare versions with packaging.version.Version, parse filename and internal WHEEL Tag, check signature sidecars when required, PEP 503-normalize names, enforce forbidden tags and minimum Python, and compare normalized Requires-Dist sets to the first manifest wheel. Emit manifest-entry release_version mismatches, unmanifested files, sdist-in-manifest policy (both SDIST_MISSING_FROM_MANIFEST and UNMANIFESTED_ARTIFACT when applicable), and PKG-INFO release_version checks with unfolding. Sort issues by (code, path, detail) using the exact detail templates from instruction.md."
verification_explanation = "The verifier asserts gate_passed is false, blocking_issue_count is 20, manifested_artifact_count is 4, disk_artifact_count is 7, and blocking_issues exactly matches the sorted list of twenty issues with prescribed detail strings — including folded Requires-Dist parsing, internal WHEEL tag mismatch, signature sidecar policy, and multi-axis version traps that survive checksum validation."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
