artifacts = ["/app/release_gate.json"]

[task]
name = "dynamo/release-gate"
description = "Audit a staged Python release bundle against manifest, policy, and embedded distribution metadata."

[metadata]
category = "build_dependency_and_release_management"
subcategory = "release_artifacts"
task_objective = ["validate", "analyze"]
artifact_type = ["archive_or_compressed_artifact", "configuration_file", "generated_output_artifact"]
expert_time_estimate_hours = 3.5
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "A release engineer gates a synthetic but realistic Python fixture bundle before PyPI publish. All five manifested wheels pass SHA-256 checks. Correct gating requires RFC 822 unfolding, selecting the `{project}-{manifest_version}.dist-info/METADATA` path while ignoring decoy dist-info trees, PEP 440 (not string) version compares including `2.0.09` vs `2.0.9`, policy-exempt `*.asc` sidecars, ignoring stale `SHA256SUMS`, counting dotfiles like `.buildmeta`, cp312 (not universal) as the Requires-Dist reference wheel, embedded WHEEL Tag vs filename tag, and signature sidecar policy. Models that grab the first dist-info, flag exempt `.asc` files, trust SHA256SUMS, or string-compare `2.0.09` produce wrong issue sets."
solution_explanation = "Load manifest and policy, enumerate direct artifact files, skip unmanifested exempt globs, hash bytes per manifest entry, and for each wheel read only `{project}-{entry.version}.dist-info/METADATA` plus its sibling WHEEL file. Unfold headers, strip env markers from Requires-Dist, compare normalized sets to the first manifest wheel (cp312), apply all version/name/tag/sidecar rules, emit sdist double issues, sort by (code, path, detail)."
verification_explanation = "Exact-match on gate_passed false, blocking_issue_count 22, manifested_artifact_count 5, disk_artifact_count 9, sorted blocking_issues list, explicit test that no UNMANIFESTED_ARTIFACT targets `.asc` files, and sdist double-emission."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
