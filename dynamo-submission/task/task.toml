artifacts = ["/app/release_gate.json"]

[task]
name = "dynamo/release-gate"
description = "Audit a staged Python release bundle against manifest, policy, and embedded distribution metadata."

[metadata]
category = "build_dependency_and_release_management"
subcategory = "release_artifacts"
task_objective = ["validate", "analyze"]
artifact_type = ["archive_or_compressed_artifact", "configuration_file", "generated_output_artifact"]
expert_time_estimate_hours = 4.0
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "A release engineer gates a synthetic fixture bundle before PyPI publish. One wheel has corrupted sha256/size; one manifest path is missing on disk. Agents must select the literal manifest-version dist-info path (not PEP-440-normalized), take the first WHEEL Tag: line, ignore later Tag: decoys, scan non-selected dist-info and non-primary PKG-INFO (including members listed before the primary), strip Requires-Dist extras/markers, honor exempt .asc files, ignore SHA256SUMS, count .buildmeta, skip subdirectory files, and emit thirty-one exact issues across eighteen rules."
solution_explanation = "Load manifest and policy, enumerate direct artifact files with exemptions, hash and size-check each present entry, and for each wheel read the selected dist-info METADATA/WHEEL (first Tag:) plus every other dist-info for stale versions. Unfold headers, normalize Requires-Dist against the first manifest wheel, apply tag/name/sidecar rules. For each sdist, read exactly basename/PKG-INFO for rule 10 and scan other PKG-INFO members for rule 18. Sort issues by (code, path, detail)."
verification_explanation = "Exact-match on gate_passed false, blocking_issue_count 31, manifested_artifact_count 7, disk_artifact_count 10, full sorted issue list, asc exemption, checksum/size/missing presence, and stale dist-info/pkg-info presence tests."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
